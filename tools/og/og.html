<!doctype html>
<!-- Link-preview card (1200x630). Re-render to public/og.png after editing; see tools/og/README.md -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Inter:wght@400;500&family=JetBrains+Mono&display=block">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #f5f2ec; color: #1d1c1a; font-family: Inter, sans-serif; position: relative; overflow: hidden; }
  svg { position: absolute; inset: 0; }
  .fade { position: absolute; inset: 0; background: radial-gradient(ellipse at 80% 50%, transparent 20%, #f5f2ec 75%); }
  main { position: absolute; left: 80px; top: 80px; right: 80px; bottom: 70px; display: flex; flex-direction: column; }
  .eyebrow { font: 500 20px 'JetBrains Mono', monospace; letter-spacing: .18em; text-transform: uppercase; color: #6b675f; }
  h1 { font: 400 112px/0.95 Fraunces, serif; letter-spacing: -0.02em; margin-top: 30px; }
  h1 em { color: #2c6b5e; }
  p { font: italic 400 36px/1.3 Fraunces, serif; margin-top: 34px; max-width: 760px; }
  .foot { margin-top: auto; display: flex; gap: 14px; }
  .chip { font: 500 20px Inter, sans-serif; padding: 8px 18px; border-radius: 999px; border: 1.5px solid #e2dcd1; background: #fbf9f5; color: #6b675f; }
</style></head>
<body>
<svg viewBox="0 0 1200 630" aria-hidden="true"></svg>
<div class="fade"></div>
<main>
  <div class="eyebrow">Python Backend Engineer · Bengaluru</div>
  <h1>Vatsal<br><em>Kanojiya</em></h1>
  <p>I build the quiet machinery behind businesses.</p>
  <div class="foot"><span class="chip">Django</span><span class="chip">PostgreSQL</span><span class="chip">Celery</span><span class="chip">ERPNext</span></div>
</main>
<script>
  // Static streamlines, same field as the hero
  const svg = document.querySelector('svg'); let d = '';
  const ang = (x, y) => Math.sin(x * .0018 + 1) * 1.3 + Math.cos(y * .0022) * 1.1 + Math.sin((x + y) * .0009) * .7;
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 520; i++) {
    let x = rnd() * 1200, y = rnd() * 630; d += `M${x.toFixed(1)} ${y.toFixed(1)}`;
    for (let s = 0; s < 70; s++) { const a = ang(x, y); x += Math.cos(a) * 2.2; y += Math.sin(a) * 2.2; d += `L${x.toFixed(1)} ${y.toFixed(1)}`; }
  }
  svg.innerHTML = `<path d="${d}" fill="none" stroke="#2c6b5e" stroke-opacity=".22" stroke-width="1"/>`;
</script>
</body></html>
